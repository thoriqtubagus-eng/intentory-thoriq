<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Background circle -->
  <circle cx="200" cy="200" r="190" fill="white" stroke="#1a3a6e" stroke-width="3"/>
  
  <!-- Yellow arc at top -->
  <path d="M 80 160 Q 200 60 320 160" fill="none" stroke="#FFD700" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Curved text "Jaya Perkasa Bojonegara" at top -->
  <defs>
    <path id="topArc" d="M 60 200 Q 200 50 340 200"/>
  </defs>
  <text font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#1a3a6e">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">Jaya Perkasa Bojonegara</textPath>
  </text>
  
  <!-- "jpb" text in center -->
  <text x="200" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="60" fill="#1a3a6e">jpb</text>
  
  <!-- Birds -->
  <path d="M 150 240 Q 155 232 160 240 Q 165 232 170 240" fill="none" stroke="#1a3a6e" stroke-width="2.5"/>
  <path d="M 200 250 Q 205 242 210 250 Q 215 242 220 250" fill="none" stroke="#1a3a6e" stroke-width="2.5"/>
  <path d="M 240 235 Q 245 227 250 235 Q 255 227 260 235" fill="none" stroke="#1a3a6e" stroke-width="2.5"/>
  
  <!-- Waves -->
  <path d="M 60 300 Q 100 280 140 300 Q 180 320 220 300 Q 260 280 300 300 Q 340 320 380 300" fill="none" stroke="#1a3a6e" stroke-width="8" stroke-linecap="round"/>
  <path d="M 40 330 Q 80 310 120 330 Q 160 350 200 330 Q 240 310 280 330 Q 320 350 360 330" fill="none" stroke="#1a3a6e" stroke-width="8" stroke-linecap="round"/>
  <path d="M 60 360 Q 100 340 140 360 Q 180 380 220 360 Q 260 340 300 360 Q 340 380 380 360" fill="none" stroke="#1a3a6e" stroke-width="8" stroke-linecap="round"/>
</svg>
